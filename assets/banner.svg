<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Querio - one query, every backend">
  <title>Querio</title>

  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="#0E1729"/>
  <rect width="1280" height="8" fill="url(#rule)"/>
  <circle cx="1180" cy="40" r="180" fill="#2563EB" fill-opacity="0.12"/>

  <g transform="translate(64,42) scale(0.84)">
    <g fill="#1E3A5F">
      <rect x="0"  y="34" width="66" height="14" rx="7"/>
      <rect x="0"  y="82" width="52" height="14" rx="7"/>
      <rect x="0" y="130" width="72" height="14" rx="7"/>
    </g>
    <circle cx="88" cy="84" r="60" fill="none" stroke="url(#ring)" stroke-width="18"/>
    <path d="M106 102 L162 158" stroke="url(#ring)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <g stroke="#5EEAD4" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M142 26 L168 26"/>
      <path d="M142 26 L168 0"/>
      <path d="M142 26 L168 52"/>
    </g>
    <g fill="#5EEAD4">
      <circle cx="172" cy="0"  r="9"/>
      <circle cx="172" cy="26" r="9"/>
      <circle cx="172" cy="52" r="9"/>
    </g>
  </g>

  <text x="290" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="700" fill="#FFFFFF">Querio</text>
  <text x="296" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" fill="#94A3B8">Store-agnostic relational query model for .NET</text>
  <text x="296" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#5EEAD4">Build the query once - render it to SQL, 1C, LINQ, a URL or a sentence</text>
</svg>
