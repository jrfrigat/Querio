name: CI

# Build + test + packaging validation on every push/PR. Publishing lives in release.yml, which runs
# on a v* tag.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test & validate packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history/tags to compute the version

      # The libraries multi-target netstandard2.0/net8/net9/net10. netstandard2.0 needs no runtime of
      # its own, but net8 and net9 do, so all three SDKs are installed; the newest drives the build.
      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Querio.slnx

      - name: Build (Release)
        run: dotnet build Querio.slnx -c Release --no-restore

      # xunit.v3 4.x runs on Microsoft.Testing.Platform, and the .NET 10 SDK removed the VSTest
      # bridge that "--logger trx" went through; global.json opts dotnet test into MTP instead.
      # The TRX filename is left at its default: both projects report into the same TestResults/,
      # so a fixed name means the second run silently overwrites the first.
      - name: Test
        run: dotnet test Querio.slnx -c Release --no-build --report-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore

      # Pack here too, so a packaging break (missing README or icon, an undocumented public member)
      # fails CI rather than the release. IsPackable=false under /tests keeps this to the 7 packages.
      - name: Pack (validation only)
        run: dotnet pack Querio.slnx -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  # Text that reads correctly can still be rejected by a server, or accepted and mean something else.
  # These render the query and then run it, asserting the rows. Their own job because pulling a SQL
  # Server image costs more than everything above put together, and the fast signal should not wait
  # for it; the SQLite half of the same suite already ran up there, where it needs no container.
  integration:
    name: Run the SQL against real engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history/tags to compute the version

      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Querio.slnx

      - name: Build (Release)
        run: dotnet build Querio.slnx -c Release --no-restore

      # QUERIO_INTEGRATION is what turns the containers on; without it the same suite runs SQLite
      # only, which is how it stays quick on a developer machine with no Docker.
      - name: Test against SQL Server, PostgreSQL and SQLite
        env:
          QUERIO_INTEGRATION: '1'
        run: dotnet test --project tests/Querio.Sql.IntegrationTests -c Release --no-build --report-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: '**/*.trx'
          if-no-files-found: ignore

  # A saved query is the contract that outlives every release, and the one place it silently stops
  # being readable is a trimmed publish: the trimmer strips the constructor parameter names a
  # serializer matches on, and nothing about that breaks a build, a test or a Debug run. So the
  # corpus is read back from inside a real trimmed publish, by both routes a consumer can take.
  trimming:
    name: Read a saved query from a trimmed publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history/tags to compute the version

      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Publish trimmed
        run: dotnet publish tests/Querio.TrimmingProbe -c Release -r linux-x64 --self-contained -o artifacts/trimprobe

      - name: Read the corpus back
        run: ./artifacts/trimprobe/Querio.TrimmingProbe

  # The icon is generated from assets/logo.svg rather than committed blind. If the two drift, the
  # package ships a mark nobody drew - so the drift is caught here instead of on nuget.org.
  icon-is-current:
    name: icon.png matches the script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate and compare
        run: |
          node scripts/make-icon.mjs
          git diff --exit-code -- icon.png \
            || (echo "icon.png is out of date: run 'node scripts/make-icon.mjs' and commit it" && exit 1)
