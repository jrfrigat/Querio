version: 2
updates:
  # NuGet package references. Querio's shipped packages take no dependency at all, so in practice
  # this covers the test stack and the build tooling.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, ci]
